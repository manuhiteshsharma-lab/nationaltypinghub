<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Exam Scorecard & Marks Analysis | National Typing Hub</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9429441787625546" crossorigin="anonymous"></script>
    <script src="assets/js/nth-layout.js" defer></script>

    <style>
        :root { 
            --bg: #f8fafc; --panel: #ffffff; --accent: #2563eb; --accent-hover: #1d4ed8;
            --accent-dim: #eff6ff; --text: #1e293b; --muted: #64748b; --border: #cbd5e1;
            --error: #ef4444; --correct: #10b981; --warning: #f59e0b;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --accent-hover: #60a5fa;
            --accent-dim: rgba(59, 130, 246, 0.15); --text: #f8fafc; --muted: #94a3b8; --border: #334155;
        }
        body { margin: 0; background: var(--bg); font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        nav { background: var(--panel); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; gap: 15px; }
        .logo-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .brand-icon { width: 34px; height: 34px; color: var(--accent); background: var(--accent-dim); padding: 5px; border-radius: 8px; }
        .brand-text { font-weight: 700; font-size: 1.4rem; color: var(--text); display: flex; align-items: baseline; }
        .brand-text .cap { font-size: 1.9rem; font-weight: 900; }
        .brand-text .accent { color: var(--accent); }
        .hamburger { display: none; font-size: 1.8rem; background: none; border: none; color: var(--text); cursor: pointer; }
        .menu-container { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .menu { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
        .menu a, .dropbtn { text-decoration: none; background: transparent; border: none; color: var(--muted); font-weight: 600; font-size: 0.95rem; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-family: 'Poppins'; }
        .menu a:hover, .dropbtn:hover, .menu a.active { color: var(--accent); background: var(--accent-dim); }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: var(--panel); min-width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 8px; border: 1px solid var(--border); z-index: 1001; top: 100%; left: 0; overflow: hidden; }
        .dropdown-content a { color: var(--text); padding: 12px 16px; display: block; border-bottom: 1px solid var(--border); }
        @media (min-width: 769px) { .dropdown:hover .dropdown-content { display: block; } }
        .icon-btn { background: var(--border); border: none; color: var(--text); font-size: 1.1rem; cursor: pointer; padding: 8px 12px; border-radius: 8px; font-weight: bold; }
        @media (max-width: 768px) {
            .hamburger { display: block; }
            .menu-container { display: none; flex-direction: column; width: 100%; align-items: flex-start; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
            .menu-container.show { display: flex; }
            .menu { flex-direction: column; width: 100%; align-items: flex-start; }
            .dropdown-content { position: static; display: none; width: 100%; }
            .dropdown.active .dropdown-content { display: block; }
        }

        .wrapper { max-width: 1400px; margin: 25px auto; padding: 0 20px; width: 100%; box-sizing: border-box; display: flex; gap: 20px; justify-content: center; align-items: flex-start; flex: 1; }
        .ad-sidebar { width: 160px; min-width: 160px; min-height: 600px; position: sticky; top: 85px; flex-shrink: 0; }
        @media (max-width: 1024px) { .ad-sidebar { display: none !important; } }

        .scorecard-main { flex: 1; max-width: 860px; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.06); box-sizing: border-box; }
        .res-header { text-align: center; margin-bottom: 20px; }
        .res-header h1 { font-size: 2rem; color: var(--accent); margin: 0 0 6px 0; }
        .cand-meta { font-size: 1.05rem; font-weight: 600; color: var(--text); }
        .total-pill { display: inline-block; background: var(--accent-dim); color: var(--accent); padding: 6px 18px; border-radius: 50px; font-weight: 800; font-size: 1rem; margin-top: 10px; border: 1px solid var(--accent); }

        .verdict-banner { padding: 15px 20px; border-radius: 10px; font-weight: 600; text-align: center; margin: 20px 0; font-size: 1rem; }
        .verdict-pass { background: rgba(16, 185, 129, 0.12); color: var(--correct); border: 1.5px solid var(--correct); }
        .verdict-fail { background: rgba(245, 158, 11, 0.12); color: var(--warning); border: 1.5px solid var(--warning); }

        .sections-container { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; }
        .section-card { flex: 1; min-width: 280px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .section-card h3 { margin: 0 0 15px 0; font-size: 1.15rem; text-align: center; padding-bottom: 10px; border-bottom: 2px dashed var(--border); }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .metric-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
        .metric-box.highlight { background: var(--accent-dim); border-color: var(--accent); }
        .metric-val { font-size: 1.4rem; font-weight: 800; color: var(--text); }
        .metric-box.highlight .metric-val, .metric-box.highlight .metric-lbl { color: var(--accent); }
        .metric-lbl { font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; margin-top: 3px; }

        .typed-text-cta { display: block; width: 100%; background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%); color: #fff; text-align: center; padding: 18px 25px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 1.12rem; box-sizing: border-box; margin: 25px 0 15px 0; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28); transition: 0.2s; }
        .typed-text-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(37, 99, 235, 0.4); }

        .formula-accordion { margin: 20px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); overflow: hidden; }
        .formula-toggle-btn { width: 100%; background: transparent; border: none; padding: 15px 20px; text-align: left; font-family: 'Poppins'; font-size: 1rem; font-weight: 700; color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .formula-toggle-btn:hover { background: var(--accent-dim); color: var(--accent); }
        .formula-body { display: none; padding: 18px 20px; border-top: 1px solid var(--border); font-size: 0.92rem; line-height: 1.7; color: var(--text); }
        .formula-code { background: var(--panel); border-left: 4px solid var(--accent); padding: 10px 14px; margin: 8px 0; font-family: monospace; font-size: 0.95rem; font-weight: 600; border-radius: 4px; }

        .action-row { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 25px; }
        .btn { padding: 12px 24px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 1rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-next-lang { background: var(--correct); color: white; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
        .btn-retake { background: var(--accent); color: white; }
        .btn-outline { border: 2px solid var(--accent); color: var(--accent); }

        footer { background: var(--panel); border-top: 1px solid var(--border); padding: 40px 20px 20px; text-align: center; margin-top: auto; }
        .footer-links { margin-bottom: 15px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .footer-links a { color: var(--muted); text-decoration: none; font-weight: 500; }
        .global-disclaimer { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(100, 116, 139, 0.2); font-size: 0.75rem; color: var(--muted); max-width: 900px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

<!-- SHARED NAVBAR INJECTED BY nth-layout.js -->
<div id="nth-nav"></div>

<div class="wrapper">
    <!-- LEFT STICKY AD -->
    <div class="ad-sidebar nth-ad-slot" data-ad-type="vertical" data-fallback-url="typing-simulators.html" data-fallback-text="🎯 Practice All Official Government Typing Simulators ➔"></div>

    <main class="scorecard-main">
        <div class="res-header">
            <h1 id="examTitle">Official Exam Scorecard</h1>
            <div class="cand-meta" id="candMeta">Candidate: -</div>
            <div class="total-pill" id="totalScorePill"></div>
        </div>

        <div id="verdictBanner" class="verdict-banner"></div>

        <!-- DYNAMIC SCORE SECTIONS -->
        <div id="sectionsContainer" class="sections-container"></div>

        <!-- IN-SCORECARD HORIZONTAL AD -->
        <div class="nth-ad-slot" data-ad-type="horizontal" style="margin: 20px auto; text-align: center; min-height: 90px; overflow: hidden;"></div>

        <!-- SEPARATE PAGE LINK FOR TYPED VS ACTUAL TEXT (TRIGGERS PAGEVIEW #3) -->
        <a href="typed-text.html" class="typed-text-cta">
            🔍 Check What You Typed vs Actual Passage (Mistakes in Red) & Download PDF ➔
        </a>

        <!-- INTERACTIVE FORMULA DROPDOWN + FULL GUIDE LINK -->
        <div class="formula-accordion">
            <button class="formula-toggle-btn" onclick="toggleFormulaBox()">
                <span>📐 How was my result calculated? (View Official Formula)</span>
                <span id="formulaArrow">▼</span>
            </button>
            <div class="formula-body" id="formulaBody">
                <p style="margin-top:0;"><strong id="fExamName">Official Evaluation Formula:</strong></p>
                <div class="formula-code" id="fGross"></div>
                <div class="formula-code" id="fNet"></div>
                <div class="formula-code" id="fAcc"></div>
                <p id="fMarksRule" style="margin: 12px 0;"></p>
                <a id="fGuideLink" href="blog.html" style="color:var(--accent); font-weight:700; text-decoration:underline;">
                    📘 Read Complete Exam Pattern, Formula & Strategy Guide ➔
                </a>
            </div>
        </div>

        <div class="action-row">
            <!-- OPTIONAL NEXT LANGUAGE BUTTON (Used by CPCT to switch EN <-> HI) -->
            <a id="nextActionBtn" href="#" class="btn btn-next-lang" style="display:none;"></a>
            <a id="retakeBtn" href="typing-simulators.html" class="btn btn-retake">🔄 Retake Typing Test</a>
            <a id="guideBtn" href="blog.html" class="btn btn-outline">📖 Exam Strategy Guide</a>
        </div>
    </main>

    <!-- RIGHT STICKY AD -->
    <div class="ad-sidebar nth-ad-slot" data-ad-type="vertical" data-fallback-url="hindi-letter-pad.html" data-fallback-text="✍️ Practice Hindi Drafting on Our Free Unicode Letter Pad ➔"></div>
</div>

<!-- SHARED FOOTER INJECTED BY nth-layout.js -->
<div id="nth-footer"></div>

<script>
    const raw = sessionStorage.getItem('nth_exam_result');
    if (!raw) {
        window.location.href = 'typing-simulators.html';
    } else {
        const data = JSON.parse(raw);
        document.getElementById('examTitle').innerText = data.examTitle || 'Official Scorecard';
        document.getElementById('candMeta').innerText = `Candidate: ${data.candidateName} | Date: ${data.date}`;
        document.getElementById('totalScorePill').innerText = data.totalScoreText || 'Evaluation Complete';

        const vb = document.getElementById('verdictBanner');
        vb.className = 'verdict-banner ' + (data.passed ? 'verdict-pass' : 'verdict-fail');
        vb.innerText = data.verdictText;

        if (data.returnUrl) document.getElementById('retakeBtn').href = data.returnUrl;
        if (data.guideUrl) {
            document.getElementById('guideBtn').href = data.guideUrl;
            document.getElementById('fGuideLink').href = data.guideUrl;
        }
        if (data.guideTitle) {
            document.getElementById('fGuideLink').innerText = "📘 " + data.guideTitle + " ➔";
        }

        // Optional Next Language Test Button (For CPCT EN -> HI or HI -> EN)
        if (data.nextActionUrl && data.nextActionText) {
            const nextBtn = document.getElementById('nextActionBtn');
            nextBtn.href = data.nextActionUrl;
            nextBtn.innerText = data.nextActionText;
            nextBtn.style.display = 'inline-flex';
        }

        // Render language sections
        const container = document.getElementById('sectionsContainer');
        container.innerHTML = (data.sections || []).map(sec => `
            <div class="section-card">
                <h3>${sec.sectionTitle}</h3>
                <div class="metrics-grid">
                    ${sec.metrics.map(m => `
                        <div class="metric-box ${m.highlight ? 'highlight' : ''}">
                            <div class="metric-val">${m.value}</div>
                            <div class="metric-lbl">${m.label}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');

        // Populate Formula Dropdown
        if (data.formulaInfo) {
            document.getElementById('fExamName').innerText = data.formulaInfo.examName + " Formula:";
            document.getElementById('fGross').innerText = data.formulaInfo.grossFormula;
            document.getElementById('fNet').innerText = data.formulaInfo.netFormula;
            document.getElementById('fAcc').innerText = data.formulaInfo.accuracyFormula;
            document.getElementById('fMarksRule').innerText = data.formulaInfo.marksRule;
        }
    }

    function toggleFormulaBox() {
        const body = document.getElementById('formulaBody');
        const arrow = document.getElementById('formulaArrow');
        if (body.style.display === 'block') {
            body.style.display = 'none';
            arrow.innerText = '▼';
        } else {
            body.style.display = 'block';
            arrow.innerText = '▲';
        }
    }
</script>
</body>
</html>
