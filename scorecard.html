<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Official Exam Scorecard & Marks Analysis | National Typing Hub</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G8P98YXFYQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-G8P98YXFYQ');
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="assets/js/nth-layout.js" defer></script>

    <style>
        :root { 
            --bg: #f8fafc; --panel: #ffffff; --accent: #2563eb; --accent-hover: #1d4ed8;
            --accent-dim: #eff6ff; --text: #1e293b; --muted: #64748b; --border: #cbd5e1;
            --error: #ef4444; --correct: #10b981; --warning: #d97706;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --accent-hover: #60a5fa;
            --accent-dim: rgba(59, 130, 246, 0.15); --text: #f8fafc; --muted: #94a3b8; --border: #334155;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

        .wrapper { max-width: 1440px; margin: 24px auto; padding: 0 16px; width: 100%; display: flex; gap: 20px; justify-content: center; align-items: flex-start; flex: 1; }
        .ad-sidebar { width: 160px; min-width: 160px; max-width: 160px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 85px; flex-shrink: 0; }

        .scorecard-main { flex: 1 1 auto; max-width: 900px; width: 100%; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 34px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
        .res-header { text-align: center; margin-bottom: 20px; }
        .res-header h1 { font-size: clamp(1.45rem, 2.5vw, 2rem); color: var(--accent); margin: 0 0 8px 0; line-height: 1.25; }
        .cand-meta { font-size: 0.98rem; font-weight: 600; color: var(--muted); }
        .total-pill { display: inline-block; background: var(--accent-dim); color: var(--accent); padding: 7px 22px; border-radius: 50px; font-weight: 800; font-size: 1.05rem; margin-top: 12px; border: 1.5px solid var(--accent); }

        .verdict-banner { padding: 15px 18px; border-radius: 10px; font-weight: 600; text-align: center; margin: 20px 0; font-size: 0.96rem; line-height: 1.5; }
        .verdict-pass { background: rgba(16, 185, 129, 0.12); color: #059669; border: 1.5px solid var(--correct); }
        .verdict-fail { background: rgba(245, 158, 11, 0.12); color: var(--warning); border: 1.5px solid var(--warning); }
        [data-theme="dark"] .verdict-pass { color: #34d399; }
        [data-theme="dark"] .verdict-fail { color: #fbbf24; }

        .sections-container { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 22px; }
        .section-card { flex: 1 1 360px; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .section-card h3 { margin: 0 0 15px 0; font-size: 1.1rem; text-align: center; padding-bottom: 10px; border-bottom: 2px dashed var(--border); }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 12px; }
        .metric-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 10px; text-align: center; }
        .metric-box.highlight { background: var(--accent-dim); border: 1.5px solid var(--accent); }
        .metric-val { font-size: 1.35rem; font-weight: 800; color: var(--text); word-break: break-word; }
        .metric-box.highlight .metric-val, .metric-box.highlight .metric-lbl { color: var(--accent); }
        .metric-lbl { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; margin-top: 3px; }

        .typed-text-cta { display: block; width: 100%; background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%); color: #fff; text-align: center; padding: 16px 20px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 1.05rem; margin: 22px 0 16px 0; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28); transition: 0.2s; line-height: 1.4; }
        .typed-text-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(37, 99, 235, 0.38); }

        .formula-accordion { margin: 18px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); overflow: hidden; }
        .formula-toggle-btn { width: 100%; background: transparent; border: none; padding: 14px 18px; text-align: left; font-family: 'Poppins', sans-serif; font-size: 0.96rem; font-weight: 700; color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .formula-toggle-btn:hover { background: var(--accent-dim); color: var(--accent); }
        .formula-body { display: none; padding: 16px 18px; border-top: 1px solid var(--border); font-size: 0.9rem; line-height: 1.7; color: var(--text); }
        .formula-code { background: var(--panel); border-left: 4px solid var(--accent); padding: 9px 12px; margin: 8px 0; font-family: monospace; font-size: 0.9rem; font-weight: 600; border-radius: 4px; word-break: break-word; }

        .action-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
        .btn { padding: 12px 22px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 0.96rem; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
        .btn-next-lang { background: var(--correct); color: #fff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
        .btn-retake { background: var(--accent); color: #fff; }
        .btn-outline { border: 2px solid var(--accent); color: var(--accent); }
        .btn:hover { transform: translateY(-2px); }

        @media (max-width: 1024px) {
            .ad-sidebar { display: none !important; }
            .scorecard-main { max-width: 100%; }
        }
        @media (max-width: 768px) {
            .wrapper { margin: 12px auto; padding: 0 10px; }
            .scorecard-main { padding: 20px 14px; border-radius: 12px; }
            .cand-meta { font-size: 0.86rem; }
            .total-pill { font-size: 0.95rem; padding: 6px 16px; }
            .verdict-banner { font-size: 0.88rem; padding: 12px; }
            .section-card { padding: 14px 12px; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); gap: 9px; }
            .metric-val { font-size: 1.2rem; }
            .typed-text-cta { font-size: 0.94rem; padding: 14px; }
            .action-row { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body data-theme="light">

<!-- SHARED NAVBAR INJECTED BY nth-layout.js -->
<div id="nth-nav"></div>

<div class="wrapper">
    <!-- LEFT SIDEBAR (Nested .nth-ad-slot fixes the 100% width clash) -->
    <div class="ad-sidebar">
        <div class="nth-ad-slot" data-ad-type="vertical" data-fallback-url="typing-simulators.html" data-fallback-text="🎯 Practice All Official Government Typing Simulators ➔"></div>
        <div class="nth-ad-slot" data-ad-type="vertical" data-fallback-url="exam-score-calculator.html" data-fallback-text="🧮 Calculate WPM & KDPH Score Online ➔"></div>
    </div>

    <main class="scorecard-main">
        <div class="res-header">
            <h1 id="examTitle">Official Exam Scorecard</h1>
            <div class="cand-meta" id="candMeta">Candidate: -</div>
            <div class="total-pill" id="totalScorePill"></div>
        </div>

        <div id="verdictBanner" class="verdict-banner"></div>

        <!-- DYNAMIC SCORE SECTIONS -->
        <div id="sectionsContainer" class="sections-container"></div>

        <!-- IN-SCORECARD HORIZONTAL AD -->
        <div class="nth-ad-slot" data-ad-type="horizontal" data-fallback-url="rssb-hindi-word-efficiency.html" data-fallback-text="📘 Practice RSSB LDC MS Word & Excel Efficiency Simulators ➔" style="margin: 18px auto; text-align: center; min-height: 90px; overflow: hidden;"></div>

        <!-- SEPARATE PAGE LINK FOR TYPED VS ACTUAL TEXT -->
        <a href="typed-text.html" class="typed-text-cta">
            🔍 Check What You Typed vs Actual Passage (Mistakes in Red) & Download PDF ➔
        </a>

        <!-- INTERACTIVE FORMULA DROPDOWN + FULL GUIDE LINK -->
        <div class="formula-accordion">
            <button class="formula-toggle-btn" onclick="toggleFormulaBox()">
                <span>📐 How was my result calculated? (View Official Formula)</span>
                <span id="formulaArrow">▼</span>
            </button>
            <div class="formula-body" id="formulaBody">
                <p style="margin-top:0;"><strong id="fExamName">Official Evaluation Formula:</strong></p>
                <div class="formula-code" id="fGross"></div>
                <div class="formula-code" id="fNet"></div>
                <div class="formula-code" id="fAcc"></div>
                <p id="fMarksRule" style="margin: 12px 0;"></p>
                <a id="fGuideLink" href="blog.html" style="color:var(--accent); font-weight:700; text-decoration:underline;">
                    📘 Read Complete Exam Pattern, Formula & Strategy Guide ➔
                </a>
            </div>
        </div>

        <div class="action-row">
            <a id="nextActionBtn" href="#" class="btn btn-next-lang" style="display:none;"></a>
            <a id="retakeBtn" href="typing-simulators.html" class="btn btn-retake">🔄 Retake Typing Test</a>
            <a id="guideBtn" href="blog.html" class="btn btn-outline">📖 Exam Strategy Guide</a>
        </div>
    </main>

    <!-- RIGHT SIDEBAR (Nested .nth-ad-slot matches Left Sidebar) -->
    <div class="ad-sidebar">
        <div class="nth-ad-slot" data-ad-type="vertical" data-fallback-url="hindi-letter-pad.html" data-fallback-text="✍️ Practice Hindi Drafting on Our Free Unicode Letter Pad ➔"></div>
        <div class="nth-ad-slot" data-ad-type="vertical" data-fallback-url="speed-test.html" data-fallback-text="⚡ Take a Quick 1-Min Typing Speed Test ➔"></div>
    </div>
</div>

<!-- SHARED FOOTER INJECTED BY nth-layout.js -->
<div id="nth-footer"></div>

<script>
    const raw = sessionStorage.getItem('nth_exam_result');
    if (!raw) {
        window.location.href = 'typing-simulators.html';
    } else {
        const data = JSON.parse(raw);
        document.getElementById('examTitle').innerText = data.examTitle || 'Official Scorecard';
        document.getElementById('candMeta').innerText = `Candidate: ${data.candidateName} | Date: ${data.date}`;
        document.getElementById('totalScorePill').innerText = data.totalScoreText || 'Evaluation Complete';

        const vb = document.getElementById('verdictBanner');
        vb.className = 'verdict-banner ' + (data.passed ? 'verdict-pass' : 'verdict-fail');
        vb.innerText = data.verdictText || '';

        if (data.returnUrl) document.getElementById('retakeBtn').href = data.returnUrl;
        if (data.guideUrl) {
            document.getElementById('guideBtn').href = data.guideUrl;
            document.getElementById('fGuideLink').href = data.guideUrl;
        }
        if (data.guideTitle) {
            document.getElementById('fGuideLink').innerText = "📘 " + data.guideTitle + " ➔";
        }

        if (data.nextActionUrl && data.nextActionText) {
            const nextBtn = document.getElementById('nextActionBtn');
            nextBtn.href = data.nextActionUrl;
            nextBtn.innerText = data.nextActionText;
            nextBtn.style.display = 'inline-flex';
        }

        const container = document.getElementById('sectionsContainer');
        container.innerHTML = (data.sections || []).map(sec => `
            <div class="section-card">
                <h3>${sec.sectionTitle}</h3>
                <div class="metrics-grid">
                    ${(sec.metrics || []).map(m => `
                        <div class="metric-box ${m.highlight ? 'highlight' : ''}">
                            <div class="metric-val">${m.value}</div>
                            <div class="metric-lbl">${m.label}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');

        if (data.formulaInfo) {
            document.getElementById('fExamName').innerText = data.formulaInfo.examName + " Formula:";
            document.getElementById('fGross').innerText = data.formulaInfo.grossFormula || '';
            document.getElementById('fNet').innerText = data.formulaInfo.netFormula || '';
            document.getElementById('fAcc').innerText = data.formulaInfo.accuracyFormula || '';
            document.getElementById('fMarksRule').innerText = data.formulaInfo.marksRule || '';
        } else {
            document.getElementById('fGross').innerText = "1 Word = 5 Keystrokes | Gross WPM = (Total Strokes ÷ 5) ÷ Time (Mins)";
            document.getElementById('fNet').innerText = "Net WPM = Gross WPM − Error Penalty per Minute";
            document.getElementById('fAcc').style.display = "none";
            document.getElementById('fMarksRule').innerText = "Exam-specific simulators apply their respective official board formulas.";
        }
    }

    function toggleFormulaBox() {
        const body = document.getElementById('formulaBody');
        const arrow = document.getElementById('formulaArrow');
        if (body.style.display === 'block') {
            body.style.display = 'none';
            arrow.innerText = '▼';
        } else {
            body.style.display = 'block';
            arrow.innerText = '▲';
        }
    }
</script>
</body>
</html>
